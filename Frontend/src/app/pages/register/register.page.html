<main class="d-flex align-items-center justify-content-center min-vh-100 bg-light p-3">
  <div class="card shadow-sm w-100" style="max-width: 560px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus fs-1 text-primary"></i>
        <h2 class="fw-bold mt-2">Crear cuenta</h2>
        <p class="text-secondary">Regístrate como cliente o agente</p>
      </div>

      @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
      }

      <form (ngSubmit)="submit()">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label" for="rol">Tipo de cuenta</label>
            <select id="rol" name="rol" class="form-select" [(ngModel)]="form.rol">
              <option value="client">Cliente</option>
              <option value="agent">Agente</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" type="text" class="form-control" [(ngModel)]="form.nombre" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="identificacion">Identificación</label>
            <input id="identificacion" name="identificacion" type="text" class="form-control" [(ngModel)]="form.identificacion" />
          </div>
          <div class="col-12">
            <label class="form-label" for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" class="form-control" [(ngModel)]="form.correo" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="telefono">Teléfono</label>
            <input id="telefono" name="telefono" type="tel" class="form-control" [(ngModel)]="form.telefono" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="city_id">Ciudad</label>
            <select id="city_id" name="city_id" class="form-select" [(ngModel)]="form.city_id">
              <option [ngValue]="null" disabled>Selecciona una ciudad</option>
              @for (c of cities(); track c.id) {
                <option [ngValue]="c.id">{{ c.nombre }} - {{ c.department }}</option>
              }
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="direccion">Dirección</label>
            <input id="direccion" name="direccion" type="text" class="form-control" [(ngModel)]="form.direccion" />
          </div>
          @if (form.rol === 'agent') {
            <div class="col-12">
              <label class="form-label" for="experiencia">Años de experiencia</label>
              <input id="experiencia" name="experiencia" type="number" min="0" class="form-control" [(ngModel)]="form.experiencia" />
            </div>
          }
          <div class="col-md-6">
            <label class="form-label" for="password">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" [(ngModel)]="form.password" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="confirm">Confirmar contraseña</label>
            <input id="confirm" name="confirm" type="password" class="form-control" [(ngModel)]="form.confirm" />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
              @if (loading()) { Registrando... } @else { Registrarme }
            </button>
          </div>
        </div>
      </form>

      <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</main>
