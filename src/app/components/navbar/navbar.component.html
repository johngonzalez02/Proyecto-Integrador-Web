<nav class="app-navbar">
  <div class="navbar-brand-section">
    <a routerLink="/" class="navbar-brand">
      <div class="brand-icon"><i class="bi bi-calendar-event"></i></div>
      <span class="brand-name">EventApp</span>
    </a>
  </div>

  <div class="navbar-navigation">
    @for (item of navbarConfig; track item.url) {
      <a [routerLink]="item.url" routerLinkActive="active" class="nav-link">
        <i class="bi bi-{{ item.icon }}"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </div>

  <div class="navbar-user-section">
    <div class="user-info">
  <div class="user-avatar">{{ initials }}</div>
  <div class="user-data">
    <span class="user-name">{{ user()?.nombre }} {{ user()?.apellido }}</span>
    <span class="user-role">{{ roleLabel }}</span>
  </div>
</div>
    <button type="button" class="logout-button" routerLink="/login">
      <i class="bi bi-box-arrow-right"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>
</nav>
