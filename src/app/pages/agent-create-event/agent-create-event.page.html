<section class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <h2 class="fw-bold">Registrar evento</h2>
    <p class="text-secondary">Completa la información del nuevo evento</p>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Nombre del evento" />
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" rows="3"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Teatro / Lugar</label>
            <input type="text" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Ciudad</label>
            <input type="text" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha de inicio</label>
            <input type="datetime-local" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha de fin</label>
            <input type="datetime-local" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Capacidad</label>
            <input type="number" min="1" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Precio (COP)</label>
            <input type="number" min="0" class="form-control" />
          </div>
          <div class="col-12">
            <label class="form-label">Observaciones</label>
            <textarea class="form-control" rows="2"></textarea>
          </div>
          <div class="col-12 text-end">
            <button type="button" class="btn btn-primary">Registrar evento</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
