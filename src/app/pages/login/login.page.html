<main class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 bg-light p-3">
  <div class="card shadow-sm w-100" style="max-width: 420px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-calendar-event fs-1 text-primary"></i>
        <h2 class="fw-bold mt-2">EventApp</h2>
        <p class="text-secondary">Inicia sesión para continuar</p>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" placeholder="correo@ejemplo.com" />
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" placeholder="••••••••" />
      </div>

      <button type="button" class="btn btn-primary w-100 mb-3">Iniciar sesión</button>

      <p class="text-center mb-3">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>

      <hr />
      <p class="text-center text-secondary small mb-2">Acceso rápido (demo)</p>
      <div class="d-flex gap-2">
        <a routerLink="/client" class="btn btn-outline-secondary btn-sm flex-fill">Cliente</a>
        <a routerLink="/agent" class="btn btn-outline-secondary btn-sm flex-fill">Agente</a>
        <a routerLink="/admin" class="btn btn-outline-secondary btn-sm flex-fill">Admin</a>
      </div>
    </div>
  </div>
</main>
